version: 2
updates:
  # Actions used in .github/workflows/* — pins get bumped, including
  # security fixes for the actions themselves (supply-chain hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # The `google` provider version constraint in terraform/versions.tf.
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"

# Not covered here, and not a Dependabot-supported ecosystem either way:
#   - Docker image tags (headscale, headplane, caddy) in
#     ansible/roles/coordination_stack/templates/docker-compose.yml.j2 —
#     it's a Jinja template, not parseable YAML, and versions are tracked as
#     the headscale_version/headplane_image vars instead. Bump those by hand
#     (or hand this file to Renovate, which handles docker-compose + Ansible
#     Galaxy — Dependabot doesn't support either).
#   - Ansible Galaxy collections in ansible/requirements.yml — same story.
