---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-docker, python3-debian]
    state: present
    update_cache: true

# deb822_repository (not the deprecated apt_repository) fetches and embeds
# the signing key itself — no separate keyring-file dance needed. Uses
# ansible_facts.* rather than the bare ansible_architecture/
# ansible_distribution_release vars, since auto-injecting those as
# top-level facts is itself deprecated (ansible-core 2.24).
- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add the connecting user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
